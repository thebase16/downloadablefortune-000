<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18131f" />
    <title>Daily Tarot</title>
    <meta
      name="description"
      content="A single daily tarot draw. No accounts, no three-card spread, just one card for the day." />
    <style>
      :root {
        --bg-1: #130f1d;
        --bg-2: #1d1828;
        --bg-3: #261d2e;
        --panel: rgba(27, 21, 31, 0.8);
        --panel-border: rgba(202, 167, 123, 0.6);
        --gold: #f0d7a8;
        --gold-strong: #c68e57;
        --ink: #f5f1eb;
        --muted: #d9c9b5;
        --shadow: rgba(0, 0, 0, 0.42);
        --rose: #a7655e;
        --sage: #6f8571;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, rgba(154, 109, 89, 0.28), transparent 20%),
          radial-gradient(circle at bottom left, rgba(72, 95, 108, 0.28), transparent 26%),
          linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 40%, var(--bg-3) 100%);
        color: var(--ink);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .app {
        width: min(980px, 100%);
        background: linear-gradient(180deg, rgba(13, 10, 17, 0.9), rgba(26, 18, 28, 0.85));
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        padding: 28px 18px 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.2rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }

      .meta {
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .card-stage {
        display: grid;
        place-items: center;
        min-height: 600px;
        position: relative;
        z-index: 1;
      }

      .card-wrap {
        position: relative;
        width: min(360px, 82vw);
        aspect-ratio: 3 / 5;
        perspective: 1600px;
      }

      .card {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        transform-style: preserve-3d;
        transition: transform 0.85s cubic-bezier(.2, .8, .2, 1);
      }

      .card.is-flipped {
        transform: rotateY(180deg) scale(1.01);
      }

      .card.reversed .face.front img {
        transform: rotate(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        backface-visibility: hidden;
        overflow: hidden;
        box-shadow: none;
        border: none;
      }

      .face img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .card.foil .face.front {
        box-shadow: 0 0 0 2px rgba(255, 232, 170, 0.7), 0 18px 38px rgba(214, 174, 96, 0.34), 0 0 40px rgba(255, 216, 115, 0.14);
      }

      .card.foil .face.front::before,
      .card.foil .face.front::after {
        content: "";
        position: absolute;
        inset: -30%;
        pointer-events: none;
      }

      .card.foil .face.front::before {
        background: linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.18) 20%,
          rgba(255, 255, 255, 0.58) 35%,
          rgba(255, 255, 255, 0.06) 48%,
          transparent 62%
        );
        transform: translateX(-30%) rotate(10deg);
        animation: foilShimmer 2.6s ease-in-out infinite alternate;
      }

      .card.foil .face.front::after {
        inset: 8px;
        border: 1px solid rgba(255, 229, 158, 0.8);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
      }

      @keyframes foilShimmer {
        0% { transform: translateX(-35%) rotate(10deg); opacity: 0.2; }
        100% { transform: translateX(35%) rotate(10deg); opacity: 0.9; }
      }

      .back {
        background:
          radial-gradient(circle at center, rgba(248, 234, 212, 0.18), transparent 52%),
          linear-gradient(145deg, #4d2d2b 0%, #2a1d2d 26%, #1b1a22 100%);
        transform: rotateY(0deg);
      }

      .back::before {
        content: "";
        position: absolute;
        inset: 0;
        border: none;
        background: rgba(46, 28, 28, 0.15);
        box-shadow: none;
      }

      .back::after {
        content: "✦";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(3rem, 10vw, 5rem);
        color: rgba(240, 215, 168, 0.82);
      }

      .front {
        transform: rotateY(180deg);
        background: linear-gradient(160deg, #f4ead8, #e3d2b5 42%, #d7b98d 100%);
      }

      .card-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: linear-gradient(180deg, rgba(19, 16, 20, 0.08), rgba(26, 17, 19, 0.54));
      }

      .card-text {
        padding: 20px 20px 18px;
        background: rgba(32, 20, 20, 0.62);
        border-top: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(2px);
      }

      .card-text .name {
        margin: 0 0 6px;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        color: #f4e3bb;
      }

      .card-text .suit {
        margin: 0 0 10px;
        color: #dbc5a0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      .card-text p {
        margin: 0;
        line-height: 1.7;
        color: var(--ink);
        font-size: 0.95rem;
      }

      .result {
        max-width: 760px;
        margin: 12px auto 0;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .result h2 {
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        margin: 0 0 8px;
        color: var(--gold);
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .result p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      @media (max-width: 640px) {
        .app { padding: 20px 14px 16px; }
        .card-wrap {
          width: min(300px, 80vw);
          height: 440px;
        }
        .card-stage { min-height: 500px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <h1>Daily Tarot</h1>
        <div id="dateStamp" class="meta">loading…</div>
      </div>

      <div class="card-stage">
        <div class="card-wrap">
          <div id="card" class="card" aria-live="polite">
            <div class="face back" aria-hidden="true">
              <img src="./goblin-card-back.png" alt="Card back" />
            </div>
            <div class="face front" aria-hidden="true">
              <img id="cardImage" src="" alt="Tarot card" />
            </div>
          </div>
        </div>
      </div>

      <div class="result">
        <h2 id="cardTitle">Guidance for today</h2>
      </div>
    </main>

        { name: 'Ace of Pentacles', suit: 'Pentacles', image: './cards/ace-of-pentacles.jpg', meaning: 'A practical opportunity is taking root. Begin with what is tangible and real.' },
        { name: 'Two of Pentacles', suit: 'Pentacles', image: './cards/two-of-pentacles.jpg', meaning: 'Balance is a practice. Keep your attention where the current needs it most.' },
        { name: 'Three of Pentacles', suit: 'Pentacles', image: './cards/three-of-pentacles.jpg', meaning: 'Skill and teamwork create momentum. Collaboration will strengthen the work.' },
        { name: 'Four of Pentacles', suit: 'Pentacles', image: './cards/four-of-pentacles.jpg', meaning: 'Security matters, but not at the cost of your own expansion.' },
        { name: 'Five of Pentacles', suit: 'Pentacles', image: './cards/five-of-pentacles.jpg', meaning: 'Hard seasons can feel isolating, but support is available if you look for it.' },
        { name: 'Six of Pentacles', suit: 'Pentacles', image: './cards/six-of-pentacles.jpg', meaning: 'Give and receive in balance. Reciprocity is part of the flow.' },
        { name: 'Seven of Pentacles', suit: 'Pentacles', image: './cards/seven-of-pentacles.jpg', meaning: 'This is a season of review. The fruits are forming, even if you cannot fully see them yet.' },
        { name: 'Eight of Pentacles', suit: 'Pentacles', image: './cards/eight-of-pentacles.jpg', meaning: 'Mastery grows through disciplined effort. Show up for the work, even in the small details.' },

        { name: 'Ten of Pentacles', suit: 'Pentacles', image: './cards/ten-of-pentacles.jpg', meaning: 'Legacy, stability, and abundance are all part of the picture. Build with the long view.' },
        { name: 'Page of Pentacles', suit: 'Pentacles', image: './cards/page-of-pentacles.jpg', meaning: 'A practical curiosity opens a promising path. Keep learning and testing what works.' },
        { name: 'Knight of Pentacles', suit: 'Pentacles', image: './cards/knight-of-pentacles.jpg', meaning: 'Steady effort and endurance will carry you farther than bursts of intensity.' },
        { name: 'Queen of Pentacles', suit: 'Pentacles', image: './cards/queen-of-pentacles.jpg', meaning: 'Grounded abundance is your gift. Care and competence can create real stability.' },

        { name: 'Two of Swords', suit: 'Swords', image: './cards/two-of-swords.jpg', meaning: 'A stalemate asks for stillness and discernment. The decision may require patience.' },
        { name: 'Three of Swords', suit: 'Swords', image: './cards/three-of-swords.jpg', meaning: 'Grief or conflict may be honest, but it is not permanent. Healing begins with naming it.' },
        { name: 'Four of Swords', suit: 'Swords', image: './cards/four-of-swords.jpg', meaning: 'Rest is a strategic act, not a luxury. Recover before moving forward.' },
        { name: 'Five of Swords', suit: 'Swords', image: './cards/five-of-swords.jpg', meaning: 'Conflict may signal a lesson in boundaries. Choose your battles with discernment.' },
        { name: 'Six of Swords', suit: 'Swords', image: './cards/six-of-swords.jpg', meaning: 'A transition is underway. Move with intention, even if the full picture is still unclear.' },
        { name: 'Seven of Swords', suit: 'Swords', image: './cards/seven-of-swords.jpg', meaning: 'Strategy is needed, but so is integrity. Watch where you are trying to outsmart reality.' },
        { name: 'Eight of Swords', suit: 'Swords', image: './cards/eight-of-swords.jpg', meaning: 'What feels limiting is often a perception that can be reframed. Reclaim your agency.' },
        { name: 'Nine of Swords', suit: 'Swords', image: './cards/nine-of-swords.jpg', meaning: 'Worry is loud, but it is not the full story. Speak the fear into the light.' },
        { name: 'Ten of Swords', suit: 'Swords', image: './cards/ten-of-swords.jpg', meaning: 'A difficult ending is clearing space for renewal. What breaks open can release a burden.' },
        { name: 'Page of Swords', suit: 'Swords', image: './cards/page-of-swords.jpg', meaning: 'Learning is active. Ask questions, gather evidence, and stay sharp.' },
        { name: 'Knight of Swords', suit: 'Swords', image: './cards/knight-of-swords.jpg', meaning: 'Quick action can be necessary, but accuracy matters as much as speed.' },

        { name: 'Two of Wands', suit: 'Wands', image: './cards/two-of-wands.jpg', meaning: 'A horizon is opening. Choose the direction that fits the future you want to build.' },
        { name: 'Three of Wands', suit: 'Wands', image: './cards/three-of-wands.jpg', meaning: 'The work is beginning to unfold beyond your immediate reach. Trust the long view.' },
        { name: 'Four of Wands', suit: 'Wands', image: './cards/four-of-wands.jpg', meaning: 'A moment of celebration and recognition is arriving. Make room for joy.' },
        { name: 'Five of Wands', suit: 'Wands', image: './cards/five-of-wands.jpg', meaning: 'Competition can be energizing, but so can strategic collaboration. Choose your angle.' },
        { name: 'Six of Wands', suit: 'Wands', image: './cards/six-of-wands.jpg', meaning: 'Recognition, confidence, and momentum are aligning. Step into the visibility you have earned.' },

        { name: 'Eight of Wands', suit: 'Wands', image: './cards/eight-of-wands.jpg', meaning: 'The pace is accelerating. Be ready for swift developments and act without delay.' },
        { name: 'Nine of Wands', suit: 'Wands', image: './cards/nine-of-wands.jpg', meaning: 'You are close. Stay strong, but do not confuse resilience with endless self-protection.' },
        { name: 'Ten of Wands', suit: 'Wands', image: './cards/ten-of-wands.jpg', meaning: 'Burden is real, but so is your capacity to lighten it. Ask what you can release.' },
        { name: 'Page of Wands', suit: 'Wands', image: './cards/page-of-wands.jpg', meaning: 'Enthusiasm is a signal. Let your curiosity lead you toward the next brave experiment.' },
        { name: 'Knight of Wands', suit: 'Wands', image: './cards/knight-of-wands.jpg', meaning: 'Movement and momentum are part of the message. Channel bold energy with direction.' },
        { name: 'Queen of Wands', suit: 'Wands', image: './cards/queen-of-wands.jpg', meaning: 'Confidence is magnetic when paired with warmth and authenticity.' },

      const cardEl = document.getElementById('card');
      const cardImage = document.getElementById('cardImage');
      const dateStamp = document.getElementById('dateStamp');
      const cardTitle = document.getElementById('cardTitle');

      function hashString(input) {
        let hash = 2166136261;
        for (let i = 0; i < input.length; i++) {
          hash ^= input.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function todayKey() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString().slice(0, 10);
      }

      function getDailyIndex() {
        return hashString(todayKey()) % deck.length;
      }

      function renderCard(card, reversed = false, foil = false) {
        cardImage.src = card.image;
        cardImage.alt = card.name;

        const titleBase = reversed ? `Reversed: ${card.name}` : card.name;
        const titleSuffix = foil ? ' • foil' : '';
        cardTitle.textContent = `${titleBase}${titleSuffix}`;

        cardEl.classList.toggle('foil', foil);
        cardEl.classList.toggle('reversed', reversed);
        cardEl.classList.remove('is-flipped');
        void cardEl.offsetWidth;
        cardEl.classList.add('is-flipped');
      }

      function setTodayCard() {
        const dailyIndex = getDailyIndex();
        const card = deck[dailyIndex];
        const reversed = hashString(`${todayKey()}-rev`) % 2 === 0;
        const foil = hashString(`${todayKey()}-foil`) % 100 < 12;
        renderCard(card, reversed, foil);
      }

      dateStamp.textContent = new Date().toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });

      setTodayCard();
    </script>
  </body>
</html>
